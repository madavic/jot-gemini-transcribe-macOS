name: CI

on:
  push:
    branches: [main]
  pull_request:
  # "Run workflow" from the Actions tab, for the first run after enabling
  # workflows on a fork, or to rebuild main without a commit.
  workflow_dispatch:

permissions:
  # The rolling `latest` pre-release below is created and replaced by the
  # workflow itself.
  contents: write

jobs:
  core-tests:
    name: JotCore tests
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run package tests
        run: swift test --package-path JotCore

  app-build:
    name: App build
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install xcodegen
        run: brew install xcodegen
      - name: Generate project
        run: xcodegen generate
      # The "Jot Dev" flavor (see JotCore/Sources/Support/AppFlavor.swift): its
      # own bundle identifier, so it installs NEXT TO the real Jot with its own
      # Keychain item, Application Support folder, defaults and TCC grants.
      - name: Build Jot Dev (unsigned)
        run: |
          # pipefail, or a failed xcodebuild hides behind tail's exit code and
          # the step goes green with no app to package.
          set -o pipefail
          xcodebuild build \
            -project Jot.xcodeproj \
            -scheme Jot \
            -configuration Debug \
            -destination 'platform=macOS' \
            -derivedDataPath build/ci \
            JOT_PRODUCT_NAME="Jot Dev" JOT_BUNDLE_ID=com.ammaar.jot.dev JOT_URL_SCHEME=jotdev \
            CODE_SIGN_IDENTITY=- CODE_SIGNING_REQUIRED=NO DEVELOPMENT_TEAM= \
            | tail -20
      # The build is kept, so a Mac without Xcode can still run the latest
      # main: download, re-sign locally with a stable identity (the ad-hoc
      # signature changes every build, and TCC would ask for Accessibility
      # again each time), copy to /Applications.
      - name: Package
        run: ditto -c -k --keepParent "build/ci/Build/Products/Debug/Jot Dev.app" Jot-Dev-latest.zip
      - name: Upload build
        uses: actions/upload-artifact@v4
        with:
          name: Jot-Dev-${{ github.sha }}
          path: Jot-Dev-latest.zip
          retention-days: 30
      # One stable URL for the newest build of main, no login needed:
      #   https://github.com/<owner>/<repo>/releases/download/latest/Jot-Dev-latest.zip
      # The release is deleted and recreated so the tag moves to this commit
      # and exactly one zip is attached. This is a fork-only convenience: it is
      # an unsigned, unnotarized Debug build and must never be handed to
      # anyone as a release.
      - name: Publish rolling build
        # Also on a manual run of main, so the first run after enabling
        # Actions on a fork publishes without needing another commit.
        if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete latest --yes --cleanup-tag --repo "$GITHUB_REPOSITORY" || true
          gh release create latest Jot-Dev-latest.zip \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --prerelease \
            --title "Latest Jot Dev build of main (${GITHUB_SHA::7})" \
            --notes "Unsigned Debug build of the Jot Dev flavor, main@${GITHUB_SHA}. For the fork owner's own Mac only — not a release."
